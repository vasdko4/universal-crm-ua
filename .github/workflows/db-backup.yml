name: DB backup

on:
  schedule:
    # GitHub Actions cron always runs on UTC. 01:30 UTC is 03:30
    # Europe/Kyiv in winter (Kyiv is UTC+2) and 04:30 in summer (UTC+3, DST).
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → Vercel Blob
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Dump production database
        # Custom compressed format (-Fc); --no-owner/--no-acl so the dump
        # restores into any database/role without permission errors.
        run: pg_dump -Fc --no-owner --no-acl -f "$RUNNER_TEMP/db-backup.dump" "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Upload to Vercel Blob and prune old backups
        # scripts/db-backup.mjs uploads the dump as
        # db-backups/YYYY-MM-DD-HHmm.dump (Europe/Kyiv) and deletes backups
        # strictly older than 10 days.
        run: node scripts/db-backup.mjs "$RUNNER_TEMP/db-backup.dump"
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
