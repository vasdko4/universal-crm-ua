# One-shot: GitHub App cannot create tags, so this branch-triggered job
# publishes the GitHub Release (which also creates tag v1.3.8).
name: publish-github-release

on:
  push:
    branches:
      - 'release-page-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.3.8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Storefront 1.3.8

            - Skip Next.js standalone output on Vercel so production deploys
            - Keep standalone for Docker/self-hosted
            - Client error page no longer imports the full i18n dictionary
            - Admin CRM screens unchanged
        run: |
          TAG=v1.3.8
          SHA=31cd51ff84443a76df5d13b9700a447142dfc3a9
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
