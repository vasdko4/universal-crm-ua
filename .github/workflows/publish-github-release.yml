# One-shot: GitHub App cannot create tags, so this branch-triggered job
# publishes the GitHub Release (which also creates tag v2.5.0).
name: publish-github-release

on:
  push:
    branches:
      - 'release-page-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release v2.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Universal CRM UA 2.5.0

            - Shop cabinet: profile header, email/password change with OTP
            - Storefront and admin leftover locale hardcoding (variants, NP, trash, requisites)
            - Address save errors are visible instead of silent fail
            - Admin orders list tracking label follows locale
            - package.json / README / installer pin 2.5.0
        run: |
          TAG=v2.5.0
          SHA=a80577618e4c05212d9353d12d7c73dd98dec53f
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
