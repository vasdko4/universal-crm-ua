# One-shot: GitHub App cannot create tags, so this branch-triggered job
# publishes the GitHub Release (which also creates tag v1.3.6).
name: publish-github-release

on:
  push:
    branches:
      - 'release-page-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.3.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Storefront 1.3.6

            - 404 home/catalog buttons keep the /ru prefix
            - Login, register, forgot-password and post-signup redirects stay on /ru
            - Language modal copy comes from the uk/ru dictionary
            - /ru meta description uses Russian seoDefaults instead of the admin UK string

            package.json version: 1.3.6
        run: |
          TAG=v1.3.6
          SHA=7042698bf247e1d44f8bdd0d102d0b1e83ac3e57
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
