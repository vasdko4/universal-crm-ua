# One-shot: GitHub App cannot create tags, so this branch-triggered job
# publishes the GitHub Release (which also creates tag vX.Y.Z).
name: publish-github-release

on:
  push:
    branches:
      - 'release-page-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release v2.5.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Universal CRM UA 2.5.1

            i18n
            - Setup wizard and DB screen: uk/ru, language switcher, live tab title
            - Setup API errors (runSetup / saveDatabaseConfig) follow locale cookie
            - Template names bilingual in wizard and admin design tab
            - Ukrainian seed labels (roles, payment methods) and store default name
            - User/role action errors follow admin locale

            Security
            - Admin product reads require products permission
            - Promo usage recording is server-only (no client inflation)
            - generatePromoCode requires promotions permission
            - Staff user mutations require 2FA cookie
            - /api/orders requires orders permission
            - CSRF trustedOrigins: Vercel/v0 wildcards only on those platforms
            - Production 2FA cookie refuses missing BETTER_AUTH_SECRET
            - bootstrapAdmin serialized with advisory lock
            - Abandoned-cart writes rate-limited
            - Public analytics never stores client orderId/amount
        run: |
          TAG=v2.5.1
          SHA=020e42c269aef00440baa7c35987fd480fc9e7b2
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
