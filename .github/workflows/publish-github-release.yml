# One-shot: GitHub App cannot create tags, so this branch-triggered job
# publishes the GitHub Release (which also creates tag v1.3.9).
name: publish-github-release

on:
  push:
    branches:
      - 'release-page-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.3.9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Storefront 1.3.9

            - Fix TypeScript in contact widget (phone META required label)
            - Restore Next.js standalone output as in the last green 1.3.6 deploy
            - Keep 1.3.7 storefront localization
            - Admin CRM screens unchanged
        run: |
          TAG=v1.3.9
          SHA=b1e8ef5fea7cef8495b88822a072ff91601d6b01
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
