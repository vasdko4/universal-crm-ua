# One-shot: GitHub App cannot create tags, so this branch-triggered job
# publishes the GitHub Release (which also creates tag v1.3.5).
name: publish-github-release

on:
  push:
    branches:
      - 'release-page-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.3.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v1.3.5
          SHA=cd490f7f796e3166c41d5f24d7ffeac50e016131
          NOTES=$(cat <<'EOF'
Storefront 1.3.5

- Cart copy goes through uk/ru dictionaries (no hardcoded Russian)
- Shared UA phone mask (+380 XX XXX XX XX) on checkout, register, phone-required dialog
- Locale-aware navigation keeps /ru on checkout, pay, account, login
- Mobile bottom nav no longer covers checkout/cart
- Product gallery thumbnails use the product name as alt text

Images: ghcr.io/vasdko4/universal-crm-ua:1.3.5 and jastindle/magazineuakraine:1.3.5
EOF
)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
