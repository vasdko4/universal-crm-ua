# One-shot: GitHub App cannot create tags, so this branch-triggered job
# publishes the GitHub Release (which also creates tag v1.3.7).
name: publish-github-release

on:
  push:
    branches:
      - 'release-page-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.3.7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Storefront 1.3.7

            - Google sign-in, auth dialog, error page, contact widget, pagination and gallery labels follow uk/ru
            - Google OAuth callback keeps /ru
            - Address book phone field uses the UA mask
            - Admin CRM screens unchanged
        run: |
          TAG=v1.3.7
          SHA=a8cd55db4bb8e7d3c4c9d48d2bfe7bd867d659e3
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
