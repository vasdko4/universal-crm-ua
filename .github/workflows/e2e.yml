name: Playwright e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techno
          POSTGRES_PASSWORD: techno
          POSTGRES_DB: techno_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techno -d techno_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://techno:techno@localhost:5432/techno_store
      BETTER_AUTH_SECRET: e2e-better-auth-secret-not-for-prod-use-32b
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: e2e-cron-secret-not-for-prod-use-32bytes
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply schema and demo seed
        run: node scripts/db-setup.mjs --seed
      - name: Run Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
