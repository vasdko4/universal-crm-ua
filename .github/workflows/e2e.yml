name: Playwright e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techno
          # Unique per run — never a committed production password.
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: techno_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techno -d techno_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://techno:${{ github.run_id }}@localhost:5432/techno_store
      BETTER_AUTH_SECRET: e2e-better-auth-secret-not-for-prod-use-32b
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: e2e-cron-secret-not-for-prod-use-32bytes
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply schema and demo seed
        run: node scripts/db-setup.mjs --seed
      - name: Run Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7