name: Playwright e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techno
          # Unique per run — never a committed production password.
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: techno_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techno -d techno_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://techno:${{ github.run_id }}@localhost:5432/techno_store
      BETTER_AUTH_SECRET: e2e-better-auth-secret-not-for-prod-use-32b
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: e2e-cron-secret-not-for-prod-use-32bytes
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      # CI-only admin. Not in seed.sql / README — created by e2e-bootstrap.mjs.
      E2E_ADMIN_EMAIL: e2e-admin@gmail.com
      E2E_ADMIN_PASSWORD: e2e-Ci-Admin-${{ github.run_id }}!
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        # --with-deps runs apt-get for Chromium's system libraries, and the
        # runner's apt DNS (azure/archive/security.ubuntu.com) fails
        # intermittently (exit 100) — 3 consecutive failures on 11.11.2026
        # for 3.4.92, all "Temporary failure resolving" on every mirror.
        # Two attempts only: each apt attempt burns ~7 min and the job
        # timeout is 35 min. If apt is still down, fall back to the
        # browser-only install — the runner image already carries the
        # system libraries (only fonts are missing), and the functional
        # e2e tests do not depend on font rendering.
        run: |
          for attempt in 1 2; do
            if pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "System-dependency install failed (apt DNS), falling back to browser-only install..."
          pnpm exec playwright install chromium
      - name: Apply schema and demo seed
        run: node scripts/db-setup.mjs --seed
      - name: Create e2e admin
        run: node scripts/e2e-bootstrap.mjs
      - name: Run Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
