# SonarCloud Automatic Analysis configuration.
# NOTE: automatic analysis ignores sonar-project.properties and only reads
# this file (.sonarcloud.properties) at the repository root.
sonar.projectKey=vasdko4_universal-crm-ua
sonar.organization=vasdko4

# i18n dictionaries, SQL migrations/seeds and generated theme palettes are
# inherently repetitive; excluding them from copy-paste detection.
sonar.cpd.exclusions=lib/i18n/dictionaries.ts,lib/i18n/admin/dictionaries.ts,lib/i18n/setup.ts,lib/admin/admin-themes.ts,db/migrate.sql,db/schema.sql,migrations/**,scripts/seed-*.mjs,scripts/db-setup.mjs,scripts/db-restore.mjs
